GeneKerman
{
    // Connect to the official Boundless Missions server by default. The serverHost/
    // Port/Protocol below are only used when the user switches to a custom IP.
    useOfficialServer = true
    serverProtocol = http
    serverHost = localhost
    serverPort = 5022
    checkInterval = 600
    enableNotifications = true
    // Feature below is taken down for revamp, do not set to "True" as it will not communicate with server.
    enableCheckpointPhotos = false
    enableKVV = true
    enableContractInjection = true
    // Stranded rescue crew are held in emergency freeze — lifted out of the simulation
    // and released by every installed life-support mod — until you get within 10 km of
    // the wreck. This is what lets a craft provisioned for one LS mod be rescued in a
    // save running another. Off leaves the crew aboard with their life support running.
    enableEmergencyFreeze = true
    // Days of YOUR life-support mod's resources stowed aboard an arriving rescue wreck,
    // per rescued kerbal — the wreck's own supplies are useless if it was built for a
    // different mod. 0 turns the ration kit off; the freeze itself is unaffected.
    emergencyRationDays = 3
}
