// Attach the GeneKerman version-independent rescaler to every part.
//
// The module is DORMANT by default (gkActive=false, gkLinear=1) — a pure no-op that
// costs nothing until a transferred craft arrives carrying snapshot data, at which point
// it re-applies the sender's already-computed scale/mass/stats without consulting any
// TweakScale exponent table. See GeneKermanScale.cs.
//
// :FINAL runs this after TweakScale's own patches so the two modules coexist cleanly;
// the module additionally re-asserts itself a frame after load to stay authoritative
// regardless of which loads last.

@PART[*]:FINAL
{
    MODULE
    {
        name = GeneKermanScale
        gkActive = false
        gkLinear = 1
        gkMass = -1
    }
}
